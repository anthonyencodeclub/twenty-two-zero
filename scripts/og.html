<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Design source for /og.png (1200×630). Regenerate with scripts/og.mjs. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 520px at 50% -10%,#2b1450,transparent 62%),
               linear-gradient(180deg,#16062b,#0d0318 72%);
    color:#f6eefe;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative}
  .grid{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;display:flex;gap:9px;z-index:2}
  .g{width:38px;height:22px;border-radius:5px;opacity:.95}
  .w{background:#52e6c4}.d{background:#a99bb8}.l{background:#ff6b5a}
  .inner{position:relative;z-index:2;text-align:center}
  .logo{font-size:190px;font-weight:900;letter-spacing:-11px;line-height:.92}
  .logo b{color:#ff3d7f}
  .tag{font-size:33px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#b9a8cc;margin-top:12px}
  .sub{font-size:26px;color:#f6eefe;margin-top:26px;opacity:.92;margin-bottom:58px}
  .sub b{color:#ffa8c6}
  .pill{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
    font-size:21px;color:#b9a8cc;letter-spacing:2.5px;text-transform:uppercase;z-index:2}
</style></head>
<body>
  <div class="grid" id="grid"></div>
  <div class="inner">
    <div class="logo">22<b>-</b>0</div>
    <div class="tag">Build the ultimate WSL XI</div>
    <div class="sub">Draft from <b>84 Women's Super League squads</b> · play a full <b>22-game season</b></div>
  </div>
  <div class="pill">Twenty-two games · zero defeats</div>
<script>
  // a season's worth of results as wallpaper — mostly wins, because that is the dream
  const cls = ['w','w','w','d','w','w','l','w','w','d','w','w','w','w','d','w','l','w','w','w','d','w'];
  document.getElementById('grid').innerHTML =
    cls.map(c => '<div class="g ' + c + '"></div>').join('');
</script>
</body></html>
